name: Build, Push & Update Version

on:
  push:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set image tag (short commit sha)
        id: vars
        run: echo "TAG=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            yisraelackerman/intermediate-project:${{ steps.vars.outputs.TAG }}
            yisraelackerman/intermediate-project:latest

      - name: Update image tag in deployment manifest
        run: |
          sed -i "s|image:.*intermediate-project:.*|image: yisraelackerman/intermediate-project:${{ steps.vars.outputs.TAG }}|" k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "ci: bump image to ${{ steps.vars.outputs.TAG }}" || echo "No changes to commit"
          git push
